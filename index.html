<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MOTH EMPIRE // GAME APP</title>
  <meta name="theme-color" content="#22d3ee" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MOTH EMPIRE" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="https://raw.githubusercontent.com/mothworldwideinfo/supreme-empire/main/DJ2fR.jpg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at top, rgba(34,211,238,.12), transparent 22%),
        linear-gradient(180deg, #030712 0%, #060b1d 40%, #02030b 100%);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(circle at top left, rgba(34,211,238,.16), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139,92,246,.16), transparent 35%);
    }
    .font-display { font-family: Orbitron, system-ui, sans-serif; }
    .glow { box-shadow: 0 0 20px rgba(34,211,238,.45), 0 0 40px rgba(139,92,246,.25); }
  </style>
</head>
<body class="text-white">
  <main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10">
    <div class="w-full max-w-md rounded-[2rem] border border-cyan-400/40 bg-gradient-to-b from-slate-950 to-black p-8 text-center glow">
      <div class="mx-auto mb-4 flex h-20 w-20 items-center justify-center overflow-hidden rounded-full border border-cyan-400/40 bg-black/70">
        <img src="https://raw.githubusercontent.com/mothworldwideinfo/supreme-empire/main/DJ2fR.jpg" alt="MOTH" class="h-full w-full object-cover" />
      </div>
      <div class="font-display text-[11px] uppercase tracking-[0.4em] text-cyan-300">MOTH EMPIRE</div>
      <h1 class="mt-2 font-display text-4xl font-black tracking-wider">GAME APP</h1>
      <p class="mt-3 text-sm text-gray-300">Create your empire self, unlock packs, and step into the moth journey. Same cosmic server as before.</p>
      <a href="./game.html" class="mt-6 block rounded-full bg-gradient-to-r from-violet-500 to-cyan-400 px-6 py-3 font-display text-sm font-black uppercase tracking-[0.3em] text-black glow">ENTER GAME</a>
      <div class="mt-3 grid grid-cols-2 gap-2">
        <a href="./shop.html" class="rounded-full border border-white/20 px-4 py-2 text-[11px] uppercase tracking-[0.22em] text-gray-300">Shop</a>
        <a href="./shop.html#sim" class="rounded-full border border-cyan-400/30 px-4 py-2 text-[11px] uppercase tracking-[0.22em] text-cyan-300">Paper book</a>
      </div>
      <p class="mt-4 text-[11px] uppercase tracking-[0.3em] text-gray-500">Offline-ready • installable • mobile first</p>
    </div>
  </main>
</body>
</html>
